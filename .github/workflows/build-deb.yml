name: build-deb
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    # Release step (softprops/action-gh-release) creates a GitHub release,
    # which requires contents:write. Without this the run fails with
    # 403 "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Python and Bash checks
        run: |
          python3 -m py_compile src/awg_panel/*.py bin/awg-panel-set-password
          python3 -W error::DeprecationWarning -m unittest discover -s tests -v
          bash -n bin/awg-panel-helper
          bash -n packaging/DEBIAN/postinst packaging/DEBIAN/prerm packaging/DEBIAN/postrm build_deb.sh
      - name: Build .deb
        run: |
          VER="$(PYTHONPATH=src python3 -c 'from awg_panel import __version__; print(__version__)')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VER" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VER" >&2
            exit 1
          fi
          ./build_deb.sh "$VER"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: awg-panel-deb
          path: dist/*.deb
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
