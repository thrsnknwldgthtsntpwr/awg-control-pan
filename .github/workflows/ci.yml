name: ci
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint (py_compile + shellcheck + visudo)
        run: |
          python3 -m py_compile src/awg_panel/*.py bin/awg-panel-set-password
          python3 -m unittest discover -s tests -v
          bash -n bin/awg-panel-helper
          bash -n packaging/DEBIAN/postinst packaging/DEBIAN/prerm packaging/DEBIAN/postrm build_deb.sh
          sudo visudo -c -f packaging/sudoers
